[build]
command = "npm run build"
publish = "dist"
[build.environment]
NODE_VERSION = "22"
[functions]
node_bundler = "esbuild"
included_files = ["generated/materials.json", "classroom-config.json"]
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "same-origin"
Permissions-Policy = "microphone=(self)"
